<!doctype html>
<meta charset="utf-8">
<title>seed</title>
<script>
(async () => {
  const STORAGE_KEY = "lector-focal:ultimo-libro";
  const BOOK_KEY = "lector-focal:libro:demostracion.pdf:1:1";
  const DATABASE_NAME = "lector-focal";
  const BOOK_STORE_NAME = "books";

  const record = {
    id: BOOK_KEY,
    name: "demostracion.pdf",
    size: 1,
    lastModified: 1,
    pageCount: 12,
    words: [
      "Prólogo","Esta","es","una","demostración","del","lector","focal",
      "Carmen","fue","a","comer","a","casa","de","carlos","y","comio","rico",
      "La","palabra","actual","sigue","centrada","gracias","al","nuevo",
      "esquema","de","diseño"
    ],
    chapters: [],
  };

  try {
    const db = await new Promise((resolve, reject) => {
      const req = indexedDB.open(DATABASE_NAME, 1);
      req.onupgradeneeded = () => {
        const database = req.result;
        if (!database.objectStoreNames.contains(BOOK_STORE_NAME)) {
          database.createObjectStore(BOOK_STORE_NAME, { keyPath: "id" });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    await new Promise((resolve, reject) => {
      const transaction = db.transaction(BOOK_STORE_NAME, "readwrite");
      transaction.oncomplete = resolve;
      transaction.onerror = () => reject(transaction.error);
      transaction.onabort = () => reject(transaction.error);
      transaction.objectStore(BOOK_STORE_NAME).put(record);
    });
    localStorage.setItem(STORAGE_KEY, BOOK_KEY);
    localStorage.setItem(BOOK_KEY, "18");
    document.body.textContent = "ok";
  } catch (error) {
    document.body.textContent = "err: " + error.message;
  }
})();
</script>
